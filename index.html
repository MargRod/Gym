<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2541B">
<title>Gym Guía</title>
<meta name="description" content="Tu guía para el gimnasio: rutina por grupos musculares, cómo se hace cada ejercicio y cuánto cargar.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gym Guía">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
<style>
/* Estilo iOS, igual que la app de la Biblia: letra redondeada, listas agrupadas, hojas que suben. Acento naranja energía. */
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --text:#000000; --text2:#6E6E73; --text3:#AEAEB2;
  --sep:rgba(60,60,67,.16); --fill:rgba(118,118,128,.12); --fill2:rgba(118,118,128,.2);
  --accent:#F2541B; --accent2:#FF8A3D; --accent-soft:rgba(242,84,27,.12); --on-accent:#FFFFFF; --fig:#0A6CD6; --mus:#CFCFD6; --mus-ln:#EFEFF3; --mus-k:#DCDCE2; --mus-h:#9E9EA8; --mus-s:#FFB892; --bm-bg:#FFFFFF;
  --good:#248A3D; --good-soft:rgba(52,199,89,.16); --warn:#B25000; --warn-soft:rgba(255,149,0,.16); --bad:#D70015; --bad-soft:rgba(255,59,48,.14);
  --bar:rgba(242,242,247,.82); --shadow:0 12px 40px rgba(0,0,0,.16); --shadow-sm:0 2px 10px rgba(0,0,0,.06);
  --tabh:58px;
  --font:ui-rounded,"SF Pro Rounded","Nunito",-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,sans-serif;
  --spring:cubic-bezier(.32,1.25,.5,1); --ease:cubic-bezier(.25,.8,.25,1);
  color-scheme:light; box-sizing:border-box;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --card:#1C1C1E; --text:#F5F5F7; --text2:#98989F; --text3:#5A5A5F;
    --sep:rgba(84,84,88,.5); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.34);
    --accent:#FF7A3D; --accent2:#FFA463; --accent-soft:rgba(255,122,61,.18); --on-accent:#1A0A00; --fig:#6CB8FF; --mus:#4A4A50; --mus-ln:#77777F; --mus-k:#56565C; --mus-h:#2C2C30; --mus-s:#C2652F; --bm-bg:#161618;
    --good:#30D158; --good-soft:rgba(48,209,88,.18); --warn:#FFB340; --warn-soft:rgba(255,159,10,.2); --bad:#FF6961; --bad-soft:rgba(255,69,58,.2);
    --bar:rgba(10,10,10,.78); --shadow:0 12px 40px rgba(0,0,0,.6); --shadow-sm:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --text:#F5F5F7; --text2:#98989F; --text3:#5A5A5F;
  --sep:rgba(84,84,88,.5); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.34);
  --accent:#FF7A3D; --accent2:#FFA463; --accent-soft:rgba(255,122,61,.18); --on-accent:#1A0A00; --fig:#6CB8FF; --mus:#4A4A50; --mus-ln:#77777F; --mus-k:#56565C; --mus-h:#2C2C30; --mus-s:#C2652F; --bm-bg:#161618;
  --good:#30D158; --good-soft:rgba(48,209,88,.18); --warn:#FFB340; --warn-soft:rgba(255,159,10,.2); --bad:#FF6961; --bad-soft:rgba(255,69,58,.2);
  --bar:rgba(10,10,10,.78); --shadow:0 12px 40px rgba(0,0,0,.6); --shadow-sm:none; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{-webkit-text-size-adjust:100%}
html.locked,html.locked body{overflow:hidden}
body{margin:0;min-height:100%;overflow-x:clip;transition:background-color .4s var(--ease);background:var(--bg);color:var(--text);font-family:var(--font);font-weight:600;font-size:17px;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 24px)}
body.no-tabs{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 110px)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
input,select{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:12px}
[hidden]{display:none!important}
a{color:var(--accent);text-decoration:none}
svg{display:block}
.wrap{max-width:640px;margin:0 auto;padding-inline:18px}
.pic{fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.pic .f{fill:currentColor;fill-opacity:.28}
.press{transition:transform .25s var(--spring),filter .2s}
.press:active{transform:scale(.97);filter:brightness(.95)}

/* barra superior */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid transparent;transition:border-color .2s}
.bar.scrolled{border-bottom-color:var(--sep)}
.bar-in{max-width:680px;margin:0 auto;height:52px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 8px;gap:4px}
.back{display:flex;align-items:center;gap:2px;color:var(--accent);font-size:17px;font-weight:700;padding:8px 6px;justify-self:start}
.back.off{visibility:hidden}
.bar-title{font-size:17px;font-weight:800;white-space:nowrap;opacity:0;transition:opacity .2s;max-width:56vw;overflow:hidden;text-overflow:ellipsis}
.bar.scrolled .bar-title,.bar-title.always{opacity:1}
.bar-actions{justify-self:end;display:flex;gap:4px;align-items:center}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--accent)}
.icon-btn:active{background:var(--fill)}
.pill-btn{height:34px;padding:0 14px;border-radius:17px;background:var(--accent);color:var(--on-accent);font-weight:800;font-size:15px}

/* pestañas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid var(--sep);padding-bottom:env(safe-area-inset-bottom,0px);transition:transform .35s var(--ease)}
body.no-tabs .tabs{transform:translateY(110%)}
.tabs-in{max-width:520px;margin:0 auto;height:var(--tabh);display:grid;grid-template-columns:repeat(4,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:700;color:var(--text2)}
.tab.on{color:var(--accent)}
.tab svg{transition:transform .3s var(--spring)}
.tab.on svg{transform:scale(1.08)}

/* vistas: entrada suave */
#view{animation:viewIn .38s var(--ease) both}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* textos */
.hero{padding:6px 0 4px}
.hero .eyebrow{color:var(--text2);font-size:15px;font-weight:700}
.hero .eyebrow::first-letter{text-transform:uppercase}
.hero h1{font-size:36px;line-height:1.08;font-weight:900;letter-spacing:-.02em;margin:2px 0 0;text-wrap:balance}
.h2{font-size:22px;font-weight:900;margin:28px 4px 10px;letter-spacing:-.01em}
.h2 small{display:block;font-size:15px;color:var(--text2);font-weight:600;letter-spacing:0;margin-top:2px}
.muted{color:var(--text2)}
.note{color:var(--text2);font-size:14.5px;line-height:1.45;margin:10px 4px 0}

/* tarjetas */
.card{background:var(--card);border-radius:22px;padding:18px;box-shadow:var(--shadow-sm)}
.today{position:relative;overflow:hidden;border-radius:26px;padding:20px 20px 18px;color:#fff;margin-top:18px;
  background:linear-gradient(135deg,var(--accent) 0%,var(--accent2) 100%);box-shadow:0 14px 34px -12px var(--accent)}
.today::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.14)}
.today .lbl{font-size:15px;font-weight:800;opacity:.9}
.today h2{font-size:30px;font-weight:900;margin:2px 0 2px;letter-spacing:-.02em;line-height:1.1}
.today .sub{font-size:15.5px;opacity:.9}
.today .meta{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 16px}
.today .meta span{background:rgba(255,255,255,.2);border-radius:12px;padding:5px 10px;font-size:14px;font-weight:800}
.today .go{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:16px;background:#fff;color:#C23A0A;font-size:18px;font-weight:900;position:relative;z-index:1}
:root[data-theme="dark"] .today .go{color:#B23300}
.today .list-mini{position:relative;z-index:1;font-size:15px;line-height:1.6;opacity:.95;margin-top:10px}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 15px;border-radius:19px;background:var(--fill);font-size:15.5px;font-weight:700;color:var(--text);transition:background .2s,color .2s,transform .25s var(--spring)}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--accent);color:var(--on-accent)}
.chip.sm{height:32px;padding:0 12px;font-size:14px}

.daygrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dayc{color:var(--text);background:var(--card);border-radius:18px;padding:14px 14px 13px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:96px;box-shadow:var(--shadow-sm)}
.dayc .dot{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;color:#fff}
.dayc b{font-size:16.5px;font-weight:800;line-height:1.2}
.dayc span{font-size:13.5px;color:var(--text2);line-height:1.3}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat{background:var(--card);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow-sm)}
.stat b{display:block;font-size:26px;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{color:var(--text2);font-size:13.5px}

/* listas agrupadas */
.list{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:var(--shadow-sm)}
.row{display:flex;align-items:center;width:100%;min-height:54px;padding:10px 16px;text-align:left;position:relative;gap:12px}
.row + .row::before{content:"";position:absolute;left:16px;right:0;top:0;border-top:.5px solid var(--sep)}
button.row:active{background:var(--fill)}
.row .name{font-size:17px;font-weight:700;flex:1;min-width:0}
.row .name small{display:block;color:var(--text2);font-size:14px;font-weight:600;margin-top:1px}
.row .meta{color:var(--text2);font-size:15.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.chev{color:var(--text3);flex:none}
.thumb{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.thumb svg{width:34px;height:34px}

/* segmentado iOS */
.seg{display:grid;grid-auto-columns:1fr;grid-auto-flow:column;background:var(--fill);border-radius:12px;padding:3px}
.seg button{height:36px;border-radius:9px;font-size:15px;font-weight:700;white-space:nowrap;transition:background .2s,box-shadow .2s}
.seg button[aria-selected="true"]{background:var(--card);box-shadow:0 3px 8px rgba(0,0,0,.12),0 1px 1px rgba(0,0,0,.04)}
:root[data-theme="dark"] .seg button[aria-selected="true"]{background:#636366}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-selected="true"]{background:#636366}}

/* máquinas */
.eqgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.eq{position:relative;background:var(--card);border-radius:18px;padding:12px 12px 12px;text-align:left;display:flex;flex-direction:column;gap:6px;border:2px solid transparent;
  transition:border-color .2s,background .2s,transform .25s var(--spring);box-shadow:var(--shadow-sm)}
.eq:active{transform:scale(.97)}
.eq .art{height:74px;border-radius:12px;background:var(--fill);color:var(--text2);display:grid;place-items:center;transition:background .2s,color .2s}
.eq .art svg{width:62px;height:62px}
.eq b{font-size:15px;font-weight:800;line-height:1.2}
.eq span{font-size:12.5px;color:var(--text2);line-height:1.3}
.eq .ck{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;background:var(--fill2);display:grid;place-items:center;color:transparent;transition:background .2s,color .2s,transform .3s var(--spring)}
.eq.on{border-color:var(--accent)}
.eq.on .art{background:var(--accent-soft);color:var(--accent)}
.eq.on .ck{background:var(--accent);color:var(--on-accent);transform:scale(1.05)}

/* sesión */
.sess-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:4px 0 14px}
.sess-head h1{font-size:30px;font-weight:900;margin:0;letter-spacing:-.02em;line-height:1.1}
.clock{font-variant-numeric:tabular-nums;color:var(--text2);font-weight:800;font-size:16px;white-space:nowrap}
.progress{height:6px;border-radius:3px;background:var(--fill);overflow:hidden;margin-bottom:16px}
.progress i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .5s var(--ease)}
.ex{background:var(--card);border-radius:22px;margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow-sm);transition:opacity .3s}
.ex.done{opacity:.72}
.ex-top{display:flex;gap:12px;padding:14px 14px 10px;align-items:flex-start;width:100%;text-align:left}
.ex-art{width:64px;height:64px;border-radius:16px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none;position:relative}
.ex-art svg{width:52px;height:52px}
.ex-art .att{position:absolute;right:-6px;bottom:-6px;width:30px;height:30px;border-radius:10px;background:var(--card);box-shadow:0 2px 8px rgba(0,0,0,.18);display:grid;place-items:center;color:var(--accent)}
.ex-art .att svg{width:24px;height:24px}
.ex-info{flex:1;min-width:0}
.ex-info h3{margin:0;font-size:18.5px;font-weight:800;line-height:1.2}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:800;padding:3px 8px;border-radius:8px;margin-top:5px;background:var(--fill)}
.tag i{width:8px;height:8px;border-radius:50%;display:block}
.ex-use{font-size:14px;color:var(--text2);margin-top:5px;line-height:1.35}
.ex-use b{color:var(--text);font-weight:800}
.ex-num{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 10px}
.pill{font-size:13.5px;font-weight:800;padding:5px 10px;border-radius:10px;background:var(--fill);font-variant-numeric:tabular-nums}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.tip{margin:0 14px 10px;padding:10px 12px;border-radius:14px;font-size:14.5px;line-height:1.4;background:var(--accent-soft)}
.tip.good{background:var(--good-soft)} .tip.warn{background:var(--warn-soft)} .tip.bad{background:var(--bad-soft)}
.tip b{font-weight:900}
.how{margin:0 14px 12px;border-radius:16px;background:var(--fill);overflow:hidden}
.how summary{list-style:none;cursor:pointer;padding:11px 14px;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:space-between;color:var(--accent)}
.how summary::-webkit-details-marker{display:none}
.how summary svg{transition:transform .3s var(--ease)}
.how[open] summary svg{transform:rotate(90deg)}
.how .body{padding:0 14px 14px;font-size:15.5px;line-height:1.5;animation:viewIn .3s var(--ease)}
.how ol{margin:0;padding-left:22px}
.how li{margin-bottom:6px}
.how .err{margin-top:10px;font-size:14.5px;color:var(--text2)}
.how .err b{color:var(--bad)}
.how .use{display:flex;gap:10px;align-items:center;margin-bottom:12px;padding:10px;border-radius:12px;background:var(--card)}
.how .use .thumb{width:48px;height:48px}
.how a.vid{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-weight:800;font-size:15px}

.sets{padding:0 10px 6px}
.set{display:grid;grid-template-columns:28px 1fr 1fr 48px;gap:8px;align-items:center;padding:5px 4px;border-radius:14px;transition:background .3s}
.set.ok{background:var(--good-soft)}
.set .n{font-weight:900;color:var(--text2);text-align:center;font-variant-numeric:tabular-nums}
.field{display:flex;align-items:center;height:46px;border-radius:12px;background:var(--fill);overflow:hidden}
.field button{width:34px;height:46px;font-size:22px;font-weight:700;color:var(--accent);flex:none}
.field button:active{background:var(--fill2)}
.field input{flex:1;min-width:0;width:100%;border:0;background:none;text-align:center;font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;padding:0;outline:none;-moz-appearance:textfield}
.field input::-webkit-outer-spin-button,.field input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.field .u{font-size:12px;color:var(--text2);font-weight:700;margin-right:6px}
.set .check{width:48px;height:46px;border-radius:14px;background:var(--fill);display:grid;place-items:center;color:var(--text3);transition:background .25s,color .25s,transform .3s var(--spring)}
.set.ok .check{background:var(--good);color:#fff;transform:scale(1.04)}
.set.ok .check svg{animation:pop .4s var(--spring)}
@keyframes pop{0%{transform:scale(.4)}100%{transform:scale(1)}}
.sets-h{display:grid;grid-template-columns:28px 1fr 1fr 48px;gap:8px;padding:0 4px 2px;font-size:12px;color:var(--text2);font-weight:800;text-align:center}
.ex-foot{display:flex;gap:8px;padding:6px 14px 14px;flex-wrap:wrap}
.ex-foot .chip{height:34px;font-size:14px}
.feel{padding:4px 14px 14px}
.feel p{margin:0 0 8px;font-size:14.5px;font-weight:800}

/* botón grande abajo */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(to top,var(--bg) 60%,transparent)}
.dock-in{max-width:640px;margin:0 auto;display:flex;gap:10px}
.big{flex:1;height:54px;border-radius:17px;background:var(--accent);color:var(--on-accent);font-size:18px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 10px 24px -10px var(--accent);transition:transform .25s var(--spring),filter .2s}
.big:active{transform:scale(.97)}
.big.ghost{background:var(--card);color:var(--text);box-shadow:var(--shadow-sm)}
.big:disabled{opacity:.4}

/* descanso */
/* Centrado con left/right + margin auto: un left:50% + translateX agrandaba el ancho de la página en Android (11 px de scroll horizontal). */
.rest{position:fixed;left:0;right:0;margin-inline:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);z-index:40;transform:translateY(calc(100% + 120px));visibility:hidden;
  display:flex;align-items:center;gap:12px;padding:10px 12px 10px 10px;border-radius:24px;background:var(--card);box-shadow:var(--shadow);
  transition:transform .45s var(--spring),visibility 0s .45s;width:min(calc(100% - 32px),400px)}
.rest.show{transform:none;visibility:visible;transition:transform .45s var(--spring),visibility 0s}
.ring{width:54px;height:54px;flex:none;position:relative}
.ring svg{width:54px;height:54px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5}
.ring .bgc{stroke:var(--fill2)} .ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;font-weight:900;font-variant-numeric:tabular-nums}
.rest .txt{flex:1;min-width:0;font-size:14px;line-height:1.3}
.rest .txt b{display:block;font-size:16px}
.rest .chip{height:34px;padding:0 11px;font-size:14px}

/* hojas */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.36);opacity:0;transition:opacity .3s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-height:88vh;display:flex;flex-direction:column;background:var(--bg);border-radius:24px 24px 0 0;
  transform:translateY(105%);transition:transform .45s var(--spring);box-shadow:var(--shadow);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.show{transform:none}
.sheet-in{max-width:640px;width:100%;margin:0 auto;overflow:auto;padding:8px 18px 22px;overscroll-behavior:contain}
.grab{width:38px;height:5px;border-radius:3px;background:var(--fill2);margin:8px auto 6px;flex:none}
.sheet h2{font-size:24px;font-weight:900;margin:6px 0 4px;letter-spacing:-.01em}
.sheet .sub{color:var(--text2);margin:0 0 14px;font-size:15px}

/* bienvenida (onboarding) */
.ob{min-height:100dvh;display:flex;flex-direction:column;padding-bottom:110px}
.ob-dots{display:flex;gap:6px;justify-content:center;padding:14px 0 6px}
.ob-dots i{width:7px;height:7px;border-radius:4px;background:var(--fill2);transition:width .35s var(--spring),background .3s}
.ob-dots i.on{width:22px;background:var(--accent)}
.ob-step{animation:stepIn .45s var(--ease) both}
.ob-step.back{animation-name:stepBack}
@keyframes stepIn{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes stepBack{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
.ob h1{font-size:32px;font-weight:900;letter-spacing:-.02em;line-height:1.1;margin:14px 0 6px;text-wrap:balance}
.ob .lead{color:var(--text2);font-size:16.5px;line-height:1.45;margin:0 0 20px}
.welcome-art{width:120px;height:120px;border-radius:32px;margin:36px 0 8px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 18px 40px -14px var(--accent);animation:float 4s ease-in-out infinite}
.welcome-art svg{width:80px;height:80px}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.feat{display:flex;gap:12px;align-items:flex-start;margin:14px 0}
.feat .thumb{width:40px;height:40px}
.feat b{display:block;font-size:16.5px}
.feat span{color:var(--text2);font-size:15px;line-height:1.35}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:14px 16px;text-align:left;border:2px solid transparent;
  transition:border-color .2s,transform .25s var(--spring);box-shadow:var(--shadow-sm)}
.opt:active{transform:scale(.98)}
.opt b{display:block;font-size:17px}
.opt span{color:var(--text2);font-size:14.5px}
.opt .rd{margin-left:auto;width:24px;height:24px;border-radius:50%;border:2px solid var(--fill2);flex:none;display:grid;place-items:center;transition:all .2s}
.opt.on{border-color:var(--accent)}
.opt.on .rd{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form label{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:800;color:var(--text2)}
.form label.full{grid-column:1/-1}
.form .field{background:var(--card);box-shadow:var(--shadow-sm)}
.form .field input{text-align:left;padding-left:14px}
.slider{display:flex;align-items:center;gap:12px}
.slider input{flex:1;accent-color:var(--accent)}
.slider b{min-width:74px;text-align:right;font-variant-numeric:tabular-nums}

/* nutrición */
.macro{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.macro div{background:var(--card);border-radius:16px;padding:12px;text-align:center;box-shadow:var(--shadow-sm)}
.macro b{display:block;font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
.macro span{font-size:13px;color:var(--text2)}
.prose{font-size:16px;line-height:1.55}
.prose p{margin:0 0 10px}
.prose ul{margin:0 0 10px;padding-left:20px}
.prose li{margin-bottom:5px}

/* historial */
.hist-day{font-size:14px;color:var(--text2);font-weight:800;margin:18px 6px 8px;text-transform:capitalize}
.bars{display:flex;align-items:flex-end;gap:6px;height:90px;padding:10px 4px 0}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bars i{width:100%;max-width:28px;border-radius:7px 7px 3px 3px;background:var(--accent);min-height:4px;transition:height .6s var(--ease)}
.bars i.zero{background:var(--fill2)}
.bars span{font-size:11.5px;color:var(--text2);font-weight:800}

/* aviso */
.toast{position:fixed;left:16px;right:16px;margin-inline:auto;width:fit-content;top:calc(env(safe-area-inset-top,0px) + 12px);z-index:70;transform:translateY(-200%);visibility:hidden;
  padding:12px 18px;border-radius:18px;background:var(--text);color:var(--bg);font-weight:800;font-size:15px;box-shadow:var(--shadow);transition:transform .45s var(--spring),visibility 0s .45s;text-align:center}
.toast.show{transform:none;visibility:visible;transition:transform .45s var(--spring),visibility 0s}

.empty{text-align:center;padding:40px 20px;color:var(--text2)}
.empty .thumb{margin:0 auto 12px;width:64px;height:64px;border-radius:20px}
.empty .thumb svg{width:44px;height:44px}
.empty b{display:block;color:var(--text);font-size:19px;margin-bottom:4px}

.confetti{position:fixed;inset:0;pointer-events:none;z-index:80}

/* botones de la tarjeta de hoy */
.go-row{display:flex;gap:10px;position:relative;z-index:1}
.go-row .go{flex:1.4}
.go2{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:52px;border-radius:16px;background:rgba(255,255,255,.22);color:#fff;font-size:16px;font-weight:900}

/* esta semana */
.wk-row{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px;scroll-snap-type:x mandatory;scrollbar-width:none}
.wk-row::-webkit-scrollbar{display:none}
.wk{flex:none;scroll-snap-align:start;width:132px;min-height:84px;border-radius:18px;background:var(--card);box-shadow:var(--shadow-sm);padding:12px 13px;text-align:left;display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden}
.wk::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.wk b{font-size:15px;font-weight:900}
.wk span{font-size:13.5px;color:var(--text2);line-height:1.3}
.wk.add{background:var(--accent-soft);color:var(--accent);box-shadow:none}
.wk.add::before{display:none}
.wk.add span{color:var(--accent);font-weight:800}
.gdot{width:9px;height:9px;border-radius:50%;display:inline-block}

/* Google */
.gbtn{width:100%;height:52px;border-radius:16px;background:var(--card);box-shadow:var(--shadow-sm);display:flex;align-items:center;justify-content:center;gap:10px;font-size:17px;font-weight:800;border:1px solid var(--sep)}
.acct-row{display:flex;gap:12px;align-items:center}
.acct img{width:44px;height:44px;border-radius:50%;flex:none}
.acct b{font-size:17px}
.list:empty{display:none}

/* entrada escalonada de listas y tarjetas */
@keyframes rise{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
:is(.list,.daygrid,.eqgrid,.opts,.stats,.wk-row,.macro,#exs.fresh)>*{animation:rise .5s var(--ease) backwards}
:is(.list,.daygrid,.eqgrid,.opts,.stats,.wk-row,.macro,#exs.fresh)>:nth-child(2){animation-delay:.04s}
:is(.list,.daygrid,.eqgrid,.opts,.stats,.wk-row,.macro,#exs.fresh)>:nth-child(3){animation-delay:.08s}
:is(.list,.daygrid,.eqgrid,.opts,.stats,.wk-row,.macro,#exs.fresh)>:nth-child(4){animation-delay:.12s}
:is(.list,.daygrid,.eqgrid,.opts,.stats,.wk-row,.macro,#exs.fresh)>:nth-child(5){animation-delay:.16s}
:is(.list,.daygrid,.eqgrid,.opts,.stats,.wk-row,.macro,#exs.fresh)>:nth-child(6){animation-delay:.2s}
:is(.list,.daygrid,.eqgrid,.opts,.stats,.wk-row,.macro,#exs.fresh)>:nth-child(7){animation-delay:.24s}
:is(.list,.daygrid,.eqgrid,.opts,.stats,.wk-row,.macro,#exs.fresh)>:nth-child(n+8){animation-delay:.28s}
.today,.card{animation:rise .5s var(--ease) backwards}
.bump{animation:bump .3s var(--spring)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.seg button,.opt,.row,.chip,.wk,.eq,.gbtn{transition:background .25s,color .25s,border-color .25s,box-shadow .25s,transform .3s var(--spring)}
.opt .rd svg,.eq .ck svg{animation:pop .35s var(--spring)}

/* el monito: persona en azul sobre la máquina naranja */
.pic .p{stroke:var(--fig);stroke-width:3.4}
.pic .p .hd{fill:var(--fig);stroke:none}
.eq:not(.on) .pic .p{opacity:.85}

/* calentamiento */
.warm{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow-sm);margin-bottom:14px}
.warm .thumb{width:48px;height:48px}
.warm .thumb svg{width:40px;height:40px}
.warm p{margin:0;font-size:14.5px;line-height:1.45}

/* mapa de músculos */
.bmap{background:var(--bm-bg);border-radius:14px;padding:12px 10px 12px;margin-bottom:12px}
.bmap svg{width:100%;max-width:420px;height:auto;display:block;margin:0 auto}
.bmap path{stroke:none;transition:fill .35s}
.bmap .bm-o{fill:var(--mus-ln);stroke:var(--mus-ln);stroke-width:5;stroke-linejoin:round}
.bmap .bm-m{fill:var(--mus)}
.bmap .bm-k{fill:var(--mus-k)}
.bmap .bm-h{fill:var(--mus-h)}
.bmap .bm-p{fill:var(--accent)}
.bmap .bm-s{fill:var(--mus-s)}
.bmap text{fill:var(--text2);font-size:46px;font-weight:800;text-anchor:middle;font-family:var(--font)}
.lic{white-space:pre-wrap;font-size:12px;line-height:1.45;color:var(--text2);background:var(--card);border-radius:14px;padding:12px;margin:12px 0 0;font-family:ui-monospace,Consolas,monospace;overflow-wrap:anywhere}
.bm-leg{display:flex;flex-direction:column;gap:4px;font-size:14px;margin-top:8px}
.bm-leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.bm-leg i.bm-p{background:var(--accent)}
.bm-leg i.bm-s{background:var(--mus-s)}

/* cambio de tema: fundido */
::view-transition-old(root),::view-transition-new(root){animation-duration:.45s;animation-timing-function:var(--ease)}
html.theming,html.theming *{transition:background-color .5s var(--ease),color .5s var(--ease),border-color .5s var(--ease),box-shadow .5s var(--ease)!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

  quad_iso:[["cuad"],[]],hinge:[["femoral","gluteo"],["lumbar"]],glute:[["gluteo"],["femoral"]],ham_iso:[["femoral"],["pantorrilla"]],
  abd:[["gluteo_med"],[]],add:[["aductor"],[]],calf:[["pantorrilla"],[]],chest:[["pecho"],["triceps","hombro_f"]],chest_inc:[["pecho","hombro_f"],["triceps"]],
  fly:[["pecho"],["hombro_f"]],vpull:[["espalda"],["biceps","hombro_b"]],hrow:[["espalda"],["biceps","hombro_b","trapecio"]],lat_iso:[["espalda"],["triceps"]],
  rear:[["hombro_b"],["trapecio","espalda"]],ohp:[["hombro_f"],["triceps","trapecio"]],lat:[["hombro_f","hombro_b"],["trapecio"]],bi:[["biceps"],["antebrazo"]],

const MUSC_N={cuad:"Cuádriceps",gluteo:"Glúteo",gluteo_med:"Glúteo medio",aductor:"Aductores",femoral:"Femoral",lumbar:"Espalda baja",pantorrilla:"Pantorrilla",
  pecho:"Pecho",triceps:"Tríceps",hombro_f:"Hombro (frente)",hombro_b:"Hombro (atrás)",espalda:"Espalda",biceps:"Bíceps",antebrazo:"Antebrazo",
  abdomen:"Abdomen",trapecio:"Trapecio",oblicuo:"Oblicuos"};
// qué pieza del dibujo pinta cada músculo, en la vista de frente (f) y de espalda (b)
const MUSC_SLUG={pecho:{f:["chest"]},abdomen:{f:["abs"]},oblicuo:{f:["obliques"]},biceps:{f:["biceps"]},triceps:{f:["triceps"],b:["triceps"]},
  antebrazo:{f:["forearm"],b:["forearm"]},hombro_f:{f:["deltoids"]},hombro_b:{b:["deltoids"]},trapecio:{f:["trapezius"],b:["trapezius"]},
  espalda:{b:["upper-back"]},lumbar:{b:["lower-back"]},gluteo:{b:["gluteal"]},gluteo_med:{b:["gluteal"]},aductor:{f:["adductors"],b:["adductors"]},
  cuad:{f:["quadriceps"]},femoral:{b:["hamstring"]},pantorrilla:{f:["calves"],b:["calves"]}};
const BODY_SKIN=new Set(["head","neck","hands","feet","ankles","knees"]);
function bodyMap(id){
  const ex=EX[id],[p,s]=MUSC_EX[id]||MUSC_PAT[ex.pat]||[[],[]];
  const slugs=(list,v)=>new Set(list.flatMap(r=>(MUSC_SLUG[r]&&MUSC_SLUG[r][v])||[]));
  const view=(parts,v)=>{
    const P=slugs(p,v),Sx=slugs(s,v);
    return parts.map(([slug,,d])=>`<path class="${slug==="hair"?"bm-h":BODY_SKIN.has(slug)?"bm-k":P.has(slug)?"bm-p":Sx.has(slug)?"bm-s":"bm-m"}" d="${d}"/>`).join("");
  };
  const names=a=>a.map(r=>MUSC_N[r]).join(", ");
  return `<div class="bmap"><svg viewBox="40 84 1368 1396" aria-label="Músculos que trabaja">
    <path class="bm-o" d="${BODY.outF}"/><path class="bm-o" d="${BODY.outB}"/>${view(BODY.front,"f")}${view(BODY.back,"b")}
    <text x="362" y="1464">Frente</text><text x="1086" y="1464">Espalda</text></svg>
    <div class="bm-leg"><span><i class="bm-p"></i><b>Trabaja:</b> ${names(p)}</span>${s.length?`<span><i class="bm-s"></i><b>Ayudan:</b> ${names(s)}</span>`:""}</div></div>`;
}
function howHTML(id,open){

  return `<details class="how"${open?" open":""}><summary>Cómo se hace ${ic("chev",18)}</summary><div class="body">${bodyMap(id)}${uses}
    <ol>${ex.how.map(h=>`<li>${esc(h)}</li>`).join("")}</ol>

/* ---------- rutas ---------- */
function route(){
  if(restT&&location.hash.indexOf("sesion")<0)stopRest();
  const h=location.hash.replace(/^#\/?/,"");const [a,b]=h.split("/");
  closeSheetQuiet();
  if(!S.done&&a!=="inicio"){renderOnboard();return}
  window.scrollTo(0,0);
  if(a==="plan")renderPlan();
  else if(a==="progreso")renderProgress();
  else if(a==="perfil")renderProfile();
  else if(a==="dia"&&DAYS[b])renderPreview(b);
  else if(a==="sesion"&&S.active)renderSession();
  else if(a==="maquinas")renderEquip();
  else if(a==="comida")renderFood();
  else if(a==="cuerpo")renderBody();
  else if(a==="inicio")renderOnboard();
  else renderHome();
  anim();
}
function closeSheetQuiet(){const sh=$("#sheet");if(sh.classList.contains("show"))closeSheet()}
addEventListener("hashchange",route);

function weekStrip(){
  const ws=weekStart(Date.now()),logs=S.logs.filter(l=>new Date(l.d).getTime()>=ws);
  const wd=t=>cap(new Date(t).toLocaleDateString("es",{weekday:"short"}).replace(".",""));

  return `<div class="h2">Esta semana<small>${logs.length?"Lo que ya entrenaste. La recomendación de arriba lo toma en cuenta.":"Todavía no registraste nada esta semana."}</small></div>
  <div class="wk-row">${chips}<button class="wk add press" data-act="quick-log"><b>${ic("plus",18)}</b><span>Registrar un entreno que ya hiciste</span></button></div>`;
}
const QL={g:new Set(),d:0};
function quickLogSheet(day){
  QL.g=new Set(day&&DAY_GROUPS[day]?DAY_GROUPS[day]:[]);QL.d=dayStart(Date.now());
  const days=[];for(let k=0;k<7;k++){const t=dayStart(Date.now())-k*864e5;days.push({t,l:k===0?"Hoy":k===1?"Ayer":cap(new Date(t).toLocaleDateString("es",{weekday:"short",day:"numeric"}).replace(".",""))})}
  openSheet(`<h2>Registrar un entreno</h2><p class="sub">Marcá lo que ya entrenaste, así no te lo vuelvo a recomendar tan pronto.</p>

   <div class="chips" id="qlGroups">${Object.keys(GROUPS).map(g=>`<button class="chip${QL.g.has(g)?" on":""}" data-act="ql-g" data-v="${g}"><i class="gdot" style="background:${GROUPS[g].c}"></i>${GROUPS[g].n}</button>`).join("")}</div>

function saveQuickLog(){
  if(!QL.g.size){toast("Elegí al menos un grupo");return}
  const gs=[...QL.g];
  // si coincide con un día conocido, se guarda como ese día (así sigue la rotación)
  const day=Object.keys(DAY_GROUPS).find(d=>DAY_GROUPS[d].length===gs.length&&DAY_GROUPS[d].every(g=>QL.g.has(g)))||"libre";
  const at=QL.d+12*36e5; // mediodía de ese día
  S.logs.push({id:uid(),d:new Date(Math.min(at,Date.now())).toISOString(),day,gs,dur:0,ex:[],q:1,u:Date.now()});
  S.logs.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);

function weekStart(d){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-x.getDay());return x.getTime()} // la semana arranca el domingo

let restT=0,restEnd=0,restTot=0,actx=null;
function startRest(sec){
  restTot=sec;restEnd=Date.now()+sec*1000;$("#rest").classList.add("show");
  $("#restTxt").textContent=["Respirá y tomá agua","Sacudí los brazos, relajá","Prepará la siguiente serie","Pensá en la técnica"][Math.floor(Math.random()*4)];
  clearInterval(restT);restT=setInterval(restTick,250);restTick();
}
function restTick(){
  const left=Math.max(0,Math.ceil((restEnd-Date.now())/1000));
  $("#restNum").textContent=Math.floor(left/60)+":"+String(left%60).padStart(2,"0");
  $("#restArc").style.strokeDashoffset=(144.5*(1-left/restTot)).toFixed(1);
  if(left<=0){stopRest();beep();buzz([200,100,200]);toast("¡A la siguiente serie!")}
}
function stopRest(){clearInterval(restT);restT=0;$("#rest").classList.remove("show")}
function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();[0,.22].forEach(d=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;o.connect(g);g.connect(actx.destination);
  g.gain.setValueAtTime(.0001,actx.currentTime+d);g.gain.exponentialRampToValueAtTime(.3,actx.currentTime+d+.02);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d+.18);o.start(actx.currentTime+d);o.stop(actx.currentTime+d+.2)})}catch(e){}}
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
function unlockAudio(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume()}catch(e){}}

function swapSheet(i){
  const cur=S.active.ex[i].id,ex=EX[cur],inUse=new Set(S.active.ex.map(e=>e.id));
  const same=Object.keys(EX).filter(id=>id!==cur&&!inUse.has(id)&&have(EX[id])&&EX[id].pat===ex.pat);
  const grp=Object.keys(EX).filter(id=>id!==cur&&!inUse.has(id)&&have(EX[id])&&EX[id].g===ex.g&&EX[id].pat!==ex.pat);
  const row=id=>`<button class="row" data-act="swap-to" data-i="${i}" data-id="${id}">${thumbEx(id)}<span class="name">${esc(EX[id].n)}<small>${esc(useLine(EX[id]))}</small></span>${ic("chev",18)}</button>`;
  openSheet(`<h2>Cambiar ejercicio</h2><p class="sub">Por si la máquina está ocupada o no te gusta.</p>
   ${same.length?`<div class="h2" style="margin-top:6px">Trabajan lo mismo</div><div class="list">${same.map(row).join("")}</div>`:""}
   ${grp.length?`<div class="h2">Otros de ${esc(GROUPS[ex.g].n.toLowerCase())}</div><div class="list">${grp.map(row).join("")}</div>`:""}
   ${!same.length&&!grp.length?`<div class="empty"><b>No hay otra opción</b>Con las máquinas que marcaste, este es el único.</div>`:""}`);
}
function addSheet(){

     <div class="card prose" style="font-size:15.5px"><ul style="margin:0">${BODIES[k].tips.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>
     <button class="big" data-act="quiz-done" style="width:100%;margin-top:16px">Listo</button>`);return;
  }
  const q=QUIZ[i];
  openSheet(`<div class="ob-dots">${QUIZ.map((_,k)=>`<i class="${k===i?"on":""}"></i>`).join("")}</div><h2 style="margin-top:10px">${esc(q.q)}</h2><p class="sub">Pregunta ${i+1} de ${QUIZ.length}</p>
   <div class="opts">${q.a.map((a,k)=>`<button class="opt" data-act="quiz-a" data-v="${k}"><div><b>${esc(a)}</b></div><span class="rd"></span></button>`).join("")}</div>`);
}

/* comida */
function renderFood(){
  setBar({title:"Comida",backTxt:"Perfil",back:()=>location.hash="#/perfil"});setTabs(null);setDock(null);
  const n=nutrition(),p=S.prof,gain=p.goal==="musculo"||p.goal==="fuerza";
  view.innerHTML=`<div class="hero"><div class="eyebrow">${esc(GOALS[p.goal].n)}${p.body?" · "+esc(BODIES[p.body].n):""}</div><h1>Comida y proteína</h1></div>
  <div class="today" style="margin-top:16px"><div class="lbl">Comé por día, más o menos</div><h2 style="font-size:40px">${n.kcal.toLocaleString("es")} kcal</h2>
   <div class="sub">Para mantenerte: ~${n.maint.toLocaleString("es")} kcal. ${gain?"Comés un poco más para subir.":p.goal==="grasa"?"Comés un poco menos para bajar grasa.":"Te mantenés."}</div></div>
  <div class="macro" style="margin-top:12px"><div><b>${n.prot} g</b><span>proteína</span></div><div><b>${n.carb} g</b><span>carbohidratos</span></div><div><b>${n.water} L</b><span>agua</span></div></div>
  <div class="h2">Cómo llegar a la proteína</div>
  <div class="card prose"><p>Repartila en 4 o 5 comidas, unos ${Math.round(n.prot/4.5)} g en cada una. Referencias:</p>
  <ul><li>1 pechuga de pollo mediana: ~35 g</li><li>3 huevos: ~18 g</li><li>1 lata de atún: ~25 g</li><li>1 taza de frijoles: ~15 g</li><li>1 vaso de leche: ~8 g</li><li>1 medida de proteína whey: ~24 g</li></ul>
  <p style="margin:0">Pesate una vez por semana, en ayunas. ${gain?"Si en 2 semanas no subiste, sumá unas 200 kcal al día.":"Si en 2 semanas no cambió nada, ajustá unas 200 kcal."}</p></div>
  <div class="h2">El "gainer" que te recomendaron</div>
  <div class="card prose"><p>Lo que te dijeron se llama <b>gainer</b> o <b>ganador de peso</b> (hay marcas como "Mass Gainer" o "Serious Mass"). Es un polvo con muchas calorías: sobre todo carbohidratos más algo de proteína, a veces 600 a 1,200 kcal por porción.</p>
  <ul><li><b>Sí funciona para subir de peso</b>, porque son muchas calorías fáciles de tomar. Le sirve sobre todo a quien es delgado y no logra comer suficiente.</li>
  <li><b>No es magia:</b> parte de lo que subís es grasa. El músculo lo hacen el entrenamiento y la proteína.</li>
  <li>Empezá con <b>media porción</b>: la porción completa suele inflar y dar gases. Tomalo entre comidas o después de entrenar, sin dejar de comer.</li>
  <li>Si ya comés bastante y solo te falta proteína, te conviene más la <b>proteína whey</b>, que es casi pura proteína.</li></ul>
  <p style="margin:0"><b>Versión casera (~700 kcal):</b> 2 vasos de leche + 1 banano + ½ taza de avena + 2 cucharadas de crema de maní. Licuado y listo.</p></div>
  <div class="h2">Otro suplemento que sí vale la pena</div>
  <div class="card prose"><p style="margin:0"><b>Creatina monohidratada</b>, 3 a 5 g al día, todos los días, a cualquier hora. Es de los suplementos más estudiados para ganar fuerza. Es barata y no hace falta "cargarla".</p></div>
  <p class="note">Son cálculos aproximados para una persona sana. Si tenés alguna condición médica, consultalo con un doctor o nutricionista.</p>`;
}

/* ---------- bienvenida ---------- */
let ob={i:0,back:false};
const OB_N=7;
function renderOnboard(){
  setBar(null);setTabs(null);
  const p=S.prof,i=ob.i;let h="";
  if(i===0)h=`<div class="welcome-art">${pic('<path d="M16 22v20M48 22v20M9 27v10M55 27v10M16 32h32"/>')}</div>

    ${inClaude()?"":sync.user?`<div class="tip good" style="margin:18px 0 0">Entraste como <b>${esc(sync.user.email)}</b>.</div>`:`<div class="h2" style="font-size:17px">¿Ya la usaste en otro teléfono?</div><button class="gbtn press" data-act="g-login">${G_LOGO} Continuar con Google</button>`}`;
  else if(i===1)h=`<h1>Contame de vos</h1><p class="lead">Con esto calculo los pesos de prueba y la comida.</p>${dataForm(p)}`;
  else if(i===2)h=`<h1>¿Qué querés lograr?</h1><p class="lead">Cambia las repeticiones, los descansos y la comida.</p><div class="opts">${Object.keys(GOALS).map(k=>`<button class="opt${p.goal===k?" on":""}" data-act="ob-set" data-key="goal" data-v="${k}"><div><b>${esc(GOALS[k].n)}</b><span>${esc(GOALS[k].s)}</span></div><span class="rd">${p.goal===k?ic("check",16):""}</span></button>`).join("")}</div>`;
  else if(i===3)h=`<h1>Tu experiencia y tu tiempo</h1><p class="lead">Si recién empezás, te pongo ejercicios fáciles de aprender primero.</p>

/* ---------- clics ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  unlockAudio();
  const a=b.dataset.act,i=+b.dataset.i,j=+b.dataset.j,v=b.dataset.v;
  const A=S.active;
  switch(a){
    case"start":startSession(b.dataset.day,b.dataset.si);break;
    case"quick-log":quickLogSheet(b.dataset.day);break;
    case"ql-day":QL.d=+v;b.parentNode.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x===b));break;
    case"ql-g":QL.g.has(v)?QL.g.delete(v):QL.g.add(v);b.classList.toggle("on",QL.g.has(v));break;
    case"ql-save":saveQuickLog();break;
    case"gym":{const gy=GYMS[v];S.prof.gym=v;S.prof.eq=gy.eq.slice();save();S.done?renderEquip():renderOnboard();toast(`Marqué las máquinas de ${esc(gy.n)}`);break;}
    case"credits":openSheet(`<h2>Créditos</h2><p class="sub">Gracias a quienes comparten su trabajo.</p>
      <div class="card prose" style="font-size:15px"><p><b>Dibujo del cuerpo y de los músculos</b><br>react-native-body-highlighter, de ELABBASSI Hicham. Licencia MIT.</p>
      <p style="margin:0"><a href="https://github.com/HichamELBSI/react-native-body-highlighter" target="_blank" rel="noopener">github.com/HichamELBSI/react-native-body-highlighter</a></p></div>
      <pre class="lic">${esc(BODY_LICENSE)}</pre>
      <div class="card prose" style="font-size:15px;margin-top:12px"><p style="margin:0"><b>Letra:</b> Nunito, de Google Fonts (licencia SIL Open Font).</p></div>`);break;
    case"g-login":googleLogin();break;
    case"g-logout":googleLogout();break;
    case"resume":location.hash="#/sesion";break;
    case"tmin":P.set("todayMin",+v);route();break;
    case"howsheet":{const ex=EX[b.dataset.id],t=target(ex),sg=suggest(b.dataset.id);
      openSheet(`<div style="display:flex;gap:12px;align-items:center;margin:6px 0 12px"><div class="ex-art">${eqPic(ex.eq[0]||"colchoneta")}${ex.a?`<span class="att">${pic(ATT[ex.a].svg)}</span>`:""}</div><div><h2 style="margin:0">${esc(ex.n)}</h2>${gTag(ex.g)}</div></div>
       <div class="ex-num" style="padding:0 0 10px"><span class="pill acc">${t.sets} × ${t.lo}–${t.hi}${t.sec?" seg":" reps"}</span></div><div class="tip ${sg.kind||""}" style="margin:0 0 10px">${sg.msg}</div>${howHTML(b.dataset.id,true).replace('class="how"','class="how" style="margin:0"')}`);break;}
    case"w-":case"w+":{const ex=EX[A.ex[i].id],s=A.ex[i].s[j];s.w=Math.max(0,Math.round((s.w+(a==="w+"?1:-1)*inc(ex))*10)/10);save();const el=document.getElementById(`w${i}_${j}`);if(el){el.value=fmtW(s.w);bump(el)}break;}
    case"r-":case"r+":{const s=A.ex[i].s[j];s.r=Math.max(0,s.r+(a==="r+"?(EX[A.ex[i].id].sec?5:1):(EX[A.ex[i].id].sec?-5:-1)));save();const el=document.getElementById(`r${i}_${j}`);if(el){el.value=s.r;bump(el)}break;}
    case"chk":onCheck(i,j);break;
    case"feel":A.ex[i].f=v;A.ex[i].fb={kind:"good",msg:v==="facil"?"Anotado: la próxima vez subimos más el peso.":v==="limite"?"Anotado: la próxima vez vamos con calma.":"Anotado: así es como tiene que sentirse."};save();rerenderEx(i);break;
    case"addset":{const s=A.ex[i].s,l=s[s.length-1]||{w:0,r:8};s.push({w:l.w,r:l.r,ok:false});save();rerenderEx(i);break;}
    case"rm":A.ex.splice(i,1);save();renderSession();toast("Ejercicio quitado");break;
    case"swap":swapSheet(i);break;
    case"swap-to":A.ex[i]=newEx(b.dataset.id);save();closeSheet();rerenderEx(i);toast("Cambiado a "+esc(EX[b.dataset.id].n));break;
    case"add-ex":addSheet();break;
    case"add-to":A.ex.push(newEx(b.dataset.id));save();closeSheet();renderSession();setTimeout(()=>{const el=document.getElementById("ex"+(A.ex.length-1));el&&el.scrollIntoView({behavior:"smooth",block:"center"})},100);break;
    case"finish":finishSession();break;
    case"sess-menu":openSheet(`<h2>Entrenamiento</h2><p class="sub">${esc(DAYS[A.day].n)}</p><div style="display:flex;flex-direction:column;gap:10px">
      <button class="big ghost" data-act="add-ex">${ic("plus",20)} Agregar ejercicio</button><button class="big ghost" data-act="discard" style="color:var(--bad)">${ic("trash",20)} Descartar sin guardar</button></div>`);break;
    case"discard":S.active=null;save();stopRest();closeSheet();location.hash="#/";toast("Entrenamiento descartado");break;
    case"sheet-close":closeSheet();break;
    case"rest-add":restEnd+=15000;restTot+=15;restTick();break;
    case"rest-skip":stopRest();break;
    case"days":S.prof.days=+v;save();renderPlan();break;
    case"pmin":S.prof.min=+v;P.set("todayMin",+v);save();renderPlan();break;
    case"log":logSheet(b.dataset.id);break;
    case"log-del-ask":$("#delZone").innerHTML=`<p class="sub" style="text-align:center">¿Seguro? No se puede deshacer.</p><div style="display:flex;gap:10px"><button class="big ghost" data-act="sheet-close">No</button><button class="big" data-act="log-del" style="background:var(--bad);color:#fff">Sí, borrar</button></div>`;break;
    case"log-del":{const id=$("#sheetIn").dataset.log;S.logs=S.logs.filter(l=>l.id!==id);S.del.push(id);save();closeSheet();renderProgress();toast("Entreno borrado");break;}
    case"edit-data":dataSheet();break;
    case"f-sex":S.prof.sex=v;b.parentNode.querySelectorAll("button").forEach(x=>x.setAttribute("aria-selected",x===b));break;
    case"f-unit":{readDataForm();convertUnit(v);$("#fW").value=fmtW(S.prof.w);b.closest(".form").querySelectorAll(".u")[2].textContent=v;b.parentNode.querySelectorAll("button").forEach(x=>x.setAttribute("aria-selected",x===b));break;}
    case"save-data":readDataForm();save();closeSheet();renderProfile();toast("Guardado");break;
    case"edit-goal":optSheet("Objetivo","Cambia las repeticiones, los descansos y la comida.",GOALS,"goal");break;
    case"edit-exp":optSheet("Experiencia","Si recién empezás, te doy ejercicios fáciles de aprender primero.",EXPS,"exp");break;
    case"set-opt":S.prof[b.dataset.key]=v;save();closeSheet();renderProfile();break;
    case"unit":convertUnit(v);save();renderProfile();break;
    case"theme":P.set("theme",v);themeAnimated(()=>{applyTheme();renderProfile()});break;
    case"eq":{const eq=S.prof.eq,k=eq.indexOf(v);if(k>=0)eq.splice(k,1);else eq.push(v);b.classList.toggle("on",k<0);b.setAttribute("aria-pressed",k<0);S.prof.gym="";save();
      document.querySelectorAll('[data-act="gym"]').forEach(o=>{o.classList.remove("on");o.querySelector(".rd").innerHTML=""});break;}
    case"body":S.prof.body=v;save();if(S.done)renderBody();else renderOnboard();break;
    case"quiz":quiz={i:0,a:[]};quizSheet();break;
    case"quiz-a":quiz.a.push(+v);quiz.i++;quizSheet();break;
    case"quiz-done":closeSheet();S.done?renderBody():renderOnboard();break;
    case"backup":{const txt=JSON.stringify(S);const done=()=>toast("Respaldo copiado. Guardalo en tus notas o WhatsApp.");
      try{navigator.clipboard.writeText(txt).then(done,()=>showBackup(txt))}catch(err){showBackup(txt)}break;}
    case"restore":openSheet(`<h2>Pegar respaldo</h2><p class="sub">Pegá el texto que copiaste antes. Se junta con lo que ya tenés.</p><textarea id="restoreTxt" style="width:100%;height:160px;border-radius:14px;border:0;background:var(--card);padding:12px;font:inherit;font-size:13px"></textarea><button class="big" data-act="restore-go" style="width:100%;margin-top:12px">Recuperar</button>`);break;
    case"restore-go":try{const r=normalize(JSON.parse($("#restoreTxt").value));S=mergeState(S,r);S.done=true;save();closeSheet();route();toast("Respaldo recuperado")}catch(err){toast("Ese texto no es un respaldo válido")}break;
    case"reset-ask":$("#resetZone").innerHTML=`<p class="sub" style="text-align:center">Se borran tus datos, máquinas y entrenos de este teléfono${sync.status==="cloud"?" y de tu cuenta":""}.</p><div style="display:flex;gap:10px"><button class="big ghost" data-act="reset-no">Cancelar</button><button class="big" data-act="reset" style="background:var(--bad);color:#fff">Borrar todo</button></div>`;break;
    case"reset-no":renderProfile();break;
    case"reset":{const del=S.logs.map(l=>l.id).concat(S.del);S=normalize(null);S.del=del;S.t=Date.now();ob={i:0,back:false};save();location.hash="#/";route();break;}
    case"ob-set":{const key=b.dataset.key;S.prof[key]=isNaN(+v)?v:+v;save();renderOnboard();break;}
    case"ob-back":if(ob.i===1)readDataForm();ob={i:Math.max(0,ob.i-1),back:true};renderOnboard();scrollTo(0,0);break;
    case"ob-next":
      if(ob.i===1)readDataForm();
      if(ob.i>=OB_N-1){S.done=true;P.set("todayMin",S.prof.min);save();location.hash="#/";route();break;}
      ob={i:ob.i+1,back:false};save();renderOnboard();scrollTo(0,0);break;
  }
});
document.addEventListener("change",e=>{
  const t=e.target;if(!t.dataset||t.dataset.k==null||!S.active)return;
  const s=S.active.ex[+t.dataset.i]&&S.active.ex[+t.dataset.i].s[+t.dataset.j];if(!s)return;
  const v=parseFloat(t.value);s[t.dataset.k]=isFinite(v)&&v>=0?v:0;save();
});
document.addEventListener("focusin",e=>{if(e.target.matches(".field input"))setTimeout(()=>e.target.select(),0)});
function bump(el){el.classList.remove("bump");void el.offsetWidth;el.classList.add("bump")}
function showBackup(txt){openSheet(`<h2>Tu respaldo</h2><p class="sub">Seleccioná todo y copialo.</p><textarea readonly style="width:100%;height:200px;border-radius:14px;border:0;background:var(--card);padding:12px;font-size:12px">${esc(txt)}</textarea>`)}

/* confeti */
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=$("#confetti"),x=c.getContext("2d");c.hidden=false;c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;x.scale(devicePixelRatio,devicePixelRatio);
  const cols=["#F2541B","#FF9500","#34C759","#007AFF","#AF52DE","#FFCC00"];
  const ps=Array.from({length:120},()=>({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*12,vy:-Math.random()*12-4,r:Math.random()*6+4,c:cols[Math.floor(Math.random()*6)],a:Math.random()*6,va:(Math.random()-.5)*.4}));
  let f=0;(function draw(){x.clearRect(0,0,innerWidth,innerHeight);ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});
    if(++f<110)requestAnimationFrame(draw);else{c.hidden=true}})();
}

/* tema */
function applyTheme(){const t=P.get("theme","auto");if(t==="auto")document.documentElement.removeAttribute("data-theme");else document.documentElement.dataset.theme=t}
// Cambio de tema animado: fundido de toda la pantalla (View Transitions) o, si no hay, transición de colores.
function themeAnimated(update){
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(!reduce&&document.startViewTransition){document.startViewTransition(update);return}
  const r=document.documentElement;r.classList.add("theming");update();setTimeout(()=>r.classList.remove("theming"),600);
}
applyTheme();
route();
initSync();
if(!inClaude()&&P.get("fbOn",false))loadFirebase().catch(()=>{});
if("serviceWorker" in navigator&&location.protocol==="https:"&&!window.claude){navigator.serviceWorker.register("sw.js").catch(()=>{})}
})();
